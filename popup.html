<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NeutralEye</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="icon48.png" alt="" class="brand-icon" />
      <span class="brand-name">NeutralEye</span>
    </div>
  </header>

  <div class="content">
    <button id="analyze" class="analyze-btn">Analyze this article</button>

    <div id="loading" class="loading" style="display:none;">
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
      <span class="loading-label">Analyzing…</span>
    </div>

    <div id="result-box" class="result-box" style="display:none;">
      <div id="result-text" class="result-text"></div>
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
