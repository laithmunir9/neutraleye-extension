<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NeutralEye - Bias Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3>NeutralEye - Bias Checker</h3>
  <div class="powered">Powered by AI</div>

  <!-- Account row -->
  <div id="user-row" class="user-row" style="display:none;">
    <span id="user-email-display" class="user-email"></span>
    <button id="logout-btn" class="link-btn">Sign out</button>
  </div>
  <div id="signin-row" class="signin-row" style="display:none;">
    <button id="show-login-btn" class="link-btn">Sign in to save history</button>
  </div>

  <!-- Login form -->
  <div id="login-form" class="login-form" style="display:none;">
    <input type="email" id="login-email" class="input-field" placeholder="Email" autocomplete="email" />
    <input type="password" id="login-password" class="input-field" placeholder="Password" autocomplete="current-password" />
    <div id="login-error" class="login-error" style="display:none;"></div>
    <div class="login-actions">
      <button id="login-submit" class="btn-primary">Sign in</button>
      <button id="login-cancel" class="link-btn">Cancel</button>
    </div>
  </div>

  <button id="analyze">Analyze</button>

  <div id="loading" style="display:none;">Reading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>

  <div id="result-box" style="display:none;">
    <div id="result-text"></div>
    <div id="history-nudge" class="history-nudge" style="display:none;">
      Sign in to save this to your history →
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
